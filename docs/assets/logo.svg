<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7e57c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5e35b1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6d00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Connection lines -->
  <line x1="50" y1="20" x2="20" y2="55" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="80" y2="55" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="50" y2="82" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="55" x2="50" y2="82" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="80" y2="55" stroke="url(#lineGradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="50" cy="20" r="10" fill="url(#nodeGradient)"/>
  <circle cx="20" cy="55" r="10" fill="url(#nodeGradient)"/>
  <circle cx="80" cy="55" r="10" fill="url(#nodeGradient)"/>
  <circle cx="50" cy="82" r="10" fill="url(#nodeGradient)"/>

  <!-- Inner dots (device indicators) -->
  <circle cx="50" cy="20" r="4" fill="white" opacity="0.9"/>
  <circle cx="20" cy="55" r="4" fill="white" opacity="0.9"/>
  <circle cx="80" cy="55" r="4" fill="white" opacity="0.9"/>
  <circle cx="50" cy="82" r="4" fill="white" opacity="0.9"/>

  <!-- Shine on top node -->
  <ellipse cx="46" cy="17" rx="4" ry="2.5" fill="white" opacity="0.25"/>
</svg>
