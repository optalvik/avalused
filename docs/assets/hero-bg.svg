<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="800" viewBox="0 0 1920 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1854"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#sky)"/>

  <!-- Subtle dot grid -->
  <g fill="#7c4dff" opacity="0.06">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/>
    <circle cx="480" cy="80" r="1.5"/><circle cx="560" cy="80" r="1.5"/><circle cx="640" cy="80" r="1.5"/><circle cx="720" cy="80" r="1.5"/><circle cx="800" cy="80" r="1.5"/>
    <circle cx="880" cy="80" r="1.5"/><circle cx="960" cy="80" r="1.5"/><circle cx="1040" cy="80" r="1.5"/><circle cx="1120" cy="80" r="1.5"/><circle cx="1200" cy="80" r="1.5"/>
    <circle cx="1280" cy="80" r="1.5"/><circle cx="1360" cy="80" r="1.5"/><circle cx="1440" cy="80" r="1.5"/><circle cx="1520" cy="80" r="1.5"/><circle cx="1600" cy="80" r="1.5"/>
    <circle cx="1680" cy="80" r="1.5"/><circle cx="1760" cy="80" r="1.5"/><circle cx="1840" cy="80" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/>
    <circle cx="480" cy="160" r="1.5"/><circle cx="560" cy="160" r="1.5"/><circle cx="640" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/><circle cx="800" cy="160" r="1.5"/>
    <circle cx="880" cy="160" r="1.5"/><circle cx="960" cy="160" r="1.5"/><circle cx="1040" cy="160" r="1.5"/><circle cx="1120" cy="160" r="1.5"/><circle cx="1200" cy="160" r="1.5"/>
    <circle cx="1280" cy="160" r="1.5"/><circle cx="1360" cy="160" r="1.5"/><circle cx="1440" cy="160" r="1.5"/><circle cx="1520" cy="160" r="1.5"/><circle cx="1600" cy="160" r="1.5"/>
    <circle cx="1680" cy="160" r="1.5"/><circle cx="1760" cy="160" r="1.5"/><circle cx="1840" cy="160" r="1.5"/>
    <circle cx="80" cy="240" r="1.5"/><circle cx="160" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/>
    <circle cx="480" cy="240" r="1.5"/><circle cx="560" cy="240" r="1.5"/><circle cx="640" cy="240" r="1.5"/><circle cx="720" cy="240" r="1.5"/><circle cx="800" cy="240" r="1.5"/>
    <circle cx="880" cy="240" r="1.5"/><circle cx="960" cy="240" r="1.5"/><circle cx="1040" cy="240" r="1.5"/><circle cx="1120" cy="240" r="1.5"/><circle cx="1200" cy="240" r="1.5"/>
    <circle cx="1280" cy="240" r="1.5"/><circle cx="1360" cy="240" r="1.5"/><circle cx="1440" cy="240" r="1.5"/><circle cx="1520" cy="240" r="1.5"/><circle cx="1600" cy="240" r="1.5"/>
    <circle cx="1680" cy="240" r="1.5"/><circle cx="1760" cy="240" r="1.5"/><circle cx="1840" cy="240" r="1.5"/>
    <circle cx="80" cy="320" r="1.5"/><circle cx="160" cy="320" r="1.5"/><circle cx="240" cy="320" r="1.5"/><circle cx="320" cy="320" r="1.5"/><circle cx="400" cy="320" r="1.5"/>
    <circle cx="480" cy="320" r="1.5"/><circle cx="560" cy="320" r="1.5"/><circle cx="640" cy="320" r="1.5"/><circle cx="720" cy="320" r="1.5"/><circle cx="800" cy="320" r="1.5"/>
    <circle cx="880" cy="320" r="1.5"/><circle cx="960" cy="320" r="1.5"/><circle cx="1040" cy="320" r="1.5"/><circle cx="1120" cy="320" r="1.5"/><circle cx="1200" cy="320" r="1.5"/>
    <circle cx="1280" cy="320" r="1.5"/><circle cx="1360" cy="320" r="1.5"/><circle cx="1440" cy="320" r="1.5"/><circle cx="1520" cy="320" r="1.5"/><circle cx="1600" cy="320" r="1.5"/>
    <circle cx="1680" cy="320" r="1.5"/><circle cx="1760" cy="320" r="1.5"/><circle cx="1840" cy="320" r="1.5"/>
    <circle cx="80" cy="400" r="1.5"/><circle cx="160" cy="400" r="1.5"/><circle cx="240" cy="400" r="1.5"/><circle cx="320" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/>
    <circle cx="480" cy="400" r="1.5"/><circle cx="560" cy="400" r="1.5"/><circle cx="640" cy="400" r="1.5"/><circle cx="720" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/>
    <circle cx="880" cy="400" r="1.5"/><circle cx="960" cy="400" r="1.5"/><circle cx="1040" cy="400" r="1.5"/><circle cx="1120" cy="400" r="1.5"/><circle cx="1200" cy="400" r="1.5"/>
    <circle cx="1280" cy="400" r="1.5"/><circle cx="1360" cy="400" r="1.5"/><circle cx="1440" cy="400" r="1.5"/><circle cx="1520" cy="400" r="1.5"/><circle cx="1600" cy="400" r="1.5"/>
    <circle cx="1680" cy="400" r="1.5"/><circle cx="1760" cy="400" r="1.5"/><circle cx="1840" cy="400" r="1.5"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       INTERNET CLOUD (top center)
       ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(960, 140)" filter="url(#glow)">
    <!-- Cloud shape -->
    <ellipse cx="0" cy="0" rx="120" ry="45" fill="#4527a0" opacity="0.6"/>
    <ellipse cx="-50" cy="-10" rx="60" ry="35" fill="#4527a0" opacity="0.5"/>
    <ellipse cx="50" cy="-10" rx="60" ry="35" fill="#4527a0" opacity="0.5"/>
    <ellipse cx="0" cy="-20" rx="70" ry="30" fill="#5e35b1" opacity="0.7"/>
    <!-- Globe/internet icon inside -->
    <circle cx="0" cy="-5" r="22" fill="none" stroke="#b388ff" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="-5" rx="10" ry="22" fill="none" stroke="#b388ff" stroke-width="1" opacity="0.5"/>
    <line x1="-22" y1="-5" x2="22" y2="-5" stroke="#b388ff" stroke-width="1" opacity="0.4"/>
    <line x1="-20" y1="-16" x2="20" y2="-16" stroke="#b388ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="-20" y1="6" x2="20" y2="6" stroke="#b388ff" stroke-width="0.8" opacity="0.3"/>
    <text x="0" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#b388ff" opacity="0.6" font-weight="600">INTERNET</text>
  </g>

  <!-- WAN link from cloud down -->
  <g stroke="#7c4dff" stroke-width="2" opacity="0.3">
    <line x1="960" y1="190" x2="960" y2="280"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="960" cy="235" r="3" fill="#00e676" opacity="0.7"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       CENTRAL ROUTER (focal point)
       ═══════════════════════════════════════════════════════════════════ -->
  <!-- Ambient glow behind router -->
  <circle cx="960" cy="320" r="80" fill="#7c4dff" opacity="0.06" filter="url(#softGlow)"/>

  <g transform="translate(960, 320)" filter="url(#bigGlow)">
    <!-- Router body -->
    <rect x="-55" y="-25" width="110" height="50" rx="8" fill="#5e35b1"/>
    <rect x="-50" y="-20" width="100" height="40" rx="6" fill="#7c4dff"/>
    <!-- Router front panel details -->
    <rect x="-42" y="-12" width="30" height="5" rx="2" fill="#1a0a2e" opacity="0.5"/>
    <rect x="-42" y="-2" width="30" height="5" rx="2" fill="#1a0a2e" opacity="0.5"/>
    <rect x="-42" y="8" width="30" height="5" rx="2" fill="#1a0a2e" opacity="0.5"/>
    <!-- Status LEDs -->
    <circle cx="12" cy="-9" r="3" fill="#00e676"/>
    <circle cx="22" cy="-9" r="3" fill="#00e676" opacity="0.6"/>
    <circle cx="32" cy="-9" r="3" fill="#ffab00"/>
    <circle cx="42" cy="-9" r="3" fill="#ff5252" opacity="0.4"/>
    <!-- Port indicators -->
    <rect x="8" y="0" width="8" height="6" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="20" y="0" width="8" height="6" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="32" y="0" width="8" height="6" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <!-- Antennas -->
    <line x1="-35" y1="-25" x2="-45" y2="-50" stroke="#9575cd" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-45" cy="-52" r="3" fill="#b388ff" opacity="0.6"/>
    <line x1="35" y1="-25" x2="45" y2="-50" stroke="#9575cd" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="-52" r="3" fill="#b388ff" opacity="0.6"/>
    <!-- Label -->
    <text x="0" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b388ff" opacity="0.5">R1 — Gateway</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       CONNECTION LINES (router to switches)
       ═══════════════════════════════════════════════════════════════════ -->
  <g stroke="#7c4dff" stroke-width="2" opacity="0.25">
    <!-- Router to left switch -->
    <path d="M905,330 Q780,380 680,440" fill="none"/>
    <!-- Router to right switch -->
    <path d="M1015,330 Q1140,380 1240,440" fill="none"/>
  </g>

  <!-- Data packets on lines -->
  <g filter="url(#glow)">
    <circle cx="790" cy="385" r="4" fill="#00e676" opacity="0.7"/>
    <circle cx="1130" cy="385" r="4" fill="#ffab00" opacity="0.7"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       LEFT SWITCH
       ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(640, 470)" filter="url(#glow)">
    <rect x="-50" y="-18" width="100" height="36" rx="5" fill="#4527a0"/>
    <rect x="-45" y="-13" width="90" height="26" rx="4" fill="#5e35b1"/>
    <!-- Ports row -->
    <rect x="-38" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-28" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-18" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-8" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="2" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="12" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="22" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="32" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <!-- LEDs -->
    <circle cx="-35" y="5" cy="6" r="2" fill="#00e676" opacity="0.7"/>
    <circle cx="-25" cy="6" r="2" fill="#00e676" opacity="0.5"/>
    <circle cx="-15" cy="6" r="2" fill="#00e676" opacity="0.7"/>
    <circle cx="-5" cy="6" r="2" fill="#ffab00" opacity="0.4"/>
    <!-- Label -->
    <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9575cd" opacity="0.5">SW1 — 2960</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       RIGHT SWITCH
       ═══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(1280, 470)" filter="url(#glow)">
    <rect x="-50" y="-18" width="100" height="36" rx="5" fill="#4527a0"/>
    <rect x="-45" y="-13" width="90" height="26" rx="4" fill="#5e35b1"/>
    <!-- Ports row -->
    <rect x="-38" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-28" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-18" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="-8" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="2" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="12" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="22" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <rect x="32" y="-7" width="7" height="5" rx="1" fill="#1a0a2e" opacity="0.6"/>
    <!-- LEDs -->
    <circle cx="-35" cy="6" r="2" fill="#00e676" opacity="0.7"/>
    <circle cx="-25" cy="6" r="2" fill="#00e676" opacity="0.5"/>
    <circle cx="-15" cy="6" r="2" fill="#00e676" opacity="0.7"/>
    <circle cx="-5" cy="6" r="2" fill="#00e676" opacity="0.6"/>
    <!-- Label -->
    <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9575cd" opacity="0.5">SW2 — 2960</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       SWITCH TO HOSTS CONNECTIONS
       ═══════════════════════════════════════════════════════════════════ -->
  <g stroke="#5e35b1" stroke-width="1.5" opacity="0.2">
    <!-- Left switch to hosts -->
    <line x1="610" y1="490" x2="470" y2="580"/>
    <line x1="640" y1="490" x2="600" y2="600"/>
    <line x1="670" y1="490" x2="760" y2="590"/>
    <!-- Right switch to hosts -->
    <line x1="1250" y1="490" x2="1130" y2="590"/>
    <line x1="1280" y1="490" x2="1280" y2="600"/>
    <line x1="1310" y1="490" x2="1440" y2="580"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       LEFT LAN HOSTS
       ═══════════════════════════════════════════════════════════════════ -->
  <g filter="url(#glow)">
    <!-- PC 1 — laptop style -->
    <g transform="translate(450, 590)">
      <rect x="0" y="0" width="42" height="28" rx="3" fill="#e0e0e0" opacity="0.85"/>
      <rect x="3" y="3" width="36" height="20" rx="2" fill="#1a0a2e"/>
      <!-- Screen content hint -->
      <line x1="8" y1="9" x2="28" y2="9" stroke="#7c4dff" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="13" x2="22" y2="13" stroke="#5e35b1" stroke-width="1" opacity="0.4"/>
      <line x1="8" y1="17" x2="32" y2="17" stroke="#5e35b1" stroke-width="1" opacity="0.3"/>
      <!-- Keyboard base -->
      <rect x="-2" y="28" width="46" height="4" rx="1" fill="#bdbdbd" opacity="0.7"/>
      <text x="21" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">192.168.1.10</text>
    </g>

    <!-- PC 2 — desktop monitor -->
    <g transform="translate(580, 608)">
      <rect x="0" y="0" width="38" height="26" rx="3" fill="#e0e0e0" opacity="0.8"/>
      <rect x="3" y="3" width="32" height="18" rx="2" fill="#1a0a2e"/>
      <rect x="14" y="26" width="10" height="6" rx="0" fill="#bdbdbd" opacity="0.6"/>
      <rect x="8" y="32" width="22" height="3" rx="1" fill="#bdbdbd" opacity="0.5"/>
      <!-- Screen glow -->
      <rect x="6" y="6" width="26" height="12" rx="1" fill="#5e35b1" opacity="0.15"/>
      <text x="19" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">192.168.1.20</text>
    </g>

    <!-- Server -->
    <g transform="translate(740, 595)">
      <rect x="0" y="0" width="36" height="48" rx="4" fill="#9575cd" opacity="0.8"/>
      <rect x="3" y="4" width="30" height="8" rx="2" fill="#1a0a2e" opacity="0.5"/>
      <rect x="3" y="16" width="30" height="8" rx="2" fill="#1a0a2e" opacity="0.5"/>
      <rect x="3" y="28" width="30" height="8" rx="2" fill="#1a0a2e" opacity="0.5"/>
      <!-- Drive LEDs -->
      <circle cx="28" cy="8" r="2" fill="#00e676" opacity="0.8"/>
      <circle cx="28" cy="20" r="2" fill="#00e676" opacity="0.6"/>
      <circle cx="28" cy="32" r="2" fill="#ffab00" opacity="0.5"/>
      <!-- Vent -->
      <rect x="8" y="39" width="20" height="5" rx="1" fill="#1a0a2e" opacity="0.3"/>
      <text x="18" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">Server</text>
    </g>
  </g>

  <!-- LAN 1 label -->
  <g>
    <text x="630" y="700" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7c4dff" opacity="0.3">LAN 1 — 192.168.1.0/24</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       RIGHT LAN HOSTS
       ═══════════════════════════════════════════════════════════════════ -->
  <g filter="url(#glow)">
    <!-- PC 3 — laptop -->
    <g transform="translate(1110, 598)">
      <rect x="0" y="0" width="42" height="28" rx="3" fill="#e0e0e0" opacity="0.8"/>
      <rect x="3" y="3" width="36" height="20" rx="2" fill="#1a0a2e"/>
      <line x1="8" y1="9" x2="28" y2="9" stroke="#ff9100" stroke-width="1" opacity="0.5"/>
      <line x1="8" y1="13" x2="24" y2="13" stroke="#ff9100" stroke-width="1" opacity="0.3"/>
      <rect x="-2" y="28" width="46" height="4" rx="1" fill="#bdbdbd" opacity="0.7"/>
      <text x="21" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">192.168.2.10</text>
    </g>

    <!-- PC 4 — desktop -->
    <g transform="translate(1260, 608)">
      <rect x="0" y="0" width="38" height="26" rx="3" fill="#e0e0e0" opacity="0.75"/>
      <rect x="3" y="3" width="32" height="18" rx="2" fill="#1a0a2e"/>
      <rect x="14" y="26" width="10" height="6" rx="0" fill="#bdbdbd" opacity="0.6"/>
      <rect x="8" y="32" width="22" height="3" rx="1" fill="#bdbdbd" opacity="0.5"/>
      <rect x="6" y="6" width="26" height="12" rx="1" fill="#5e35b1" opacity="0.15"/>
      <text x="19" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">192.168.2.20</text>
    </g>

    <!-- Phone/tablet -->
    <g transform="translate(1425, 588)">
      <rect x="0" y="0" width="22" height="38" rx="4" fill="#e0e0e0" opacity="0.75"/>
      <rect x="2" y="5" width="18" height="26" rx="1" fill="#1a0a2e"/>
      <circle cx="11" cy="35" r="2" fill="#bdbdbd" opacity="0.4"/>
      <text x="11" y="54" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9575cd" opacity="0.45">DHCP</text>
    </g>
  </g>

  <!-- LAN 2 label -->
  <g>
    <text x="1280" y="700" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7c4dff" opacity="0.3">LAN 2 — 192.168.2.0/24</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       FLOATING IP / SUBNET INFO (ambient decoration)
       ═══════════════════════════════════════════════════════════════════ -->
  <g font-family="'JetBrains Mono', monospace" fill="#b388ff" opacity="0.12">
    <text x="120" y="300" font-size="13">255.255.255.0</text>
    <text x="1600" y="250" font-size="13">/24</text>
    <text x="200" y="500" font-size="11">default-gateway</text>
    <text x="1550" y="500" font-size="11">show ip route</text>
    <text x="100" y="680" font-size="11">ping 192.168.1.1</text>
    <text x="1600" y="680" font-size="11">ip address</text>
    <text x="350" y="150" font-size="10">enable</text>
    <text x="1500" y="150" font-size="10">configure terminal</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       PACKET ANIMATION DOTS
       ═══════════════════════════════════════════════════════════════════ -->
  <g filter="url(#glow)">
    <!-- Going up to internet -->
    <circle cx="960" cy="210" r="3.5" fill="#00e676" opacity="0.6"/>
    <!-- On left LAN -->
