
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620">
  <rect width="980" height="620" fill="#FFFFFF"/>
  <text x="490" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#02041A" opacity="0.88" text-anchor="middle">OSI mudeli kapseldamine 5 kihis</text>
  
  <!-- Layer 5 -->
  <rect x="20" y="60" width="280" height="90" rx="16" fill="#2997FF"/>
  <text x="160" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kiht 5 - Rakendus</text>
  <text x="160" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">(Application)</text>
  <text x="160" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">Andmed</text>
  <path d="M 310 105 L 340 105" stroke="#02041A" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="340,105 332,101 332,109" fill="#02041A" opacity="0.4"/>
  <rect x="350" y="85" width="300" height="40" rx="8" fill="#02041A" opacity="0.06"/>
  <text x="500" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Andmed</text>
  
  <!-- Layer 4 -->
  <rect x="20" y="170" width="280" height="90" rx="16" fill="#5DD6CC"/>
  <text x="160" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kiht 4 - Transport</text>
  <text x="160" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">TCP päis + Andmed</text>
  <text x="160" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">= Segment</text>
  <path d="M 310 215 L 340 215" stroke="#02041A" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="340,215 332,211 332,219" fill="#02041A" opacity="0.4"/>
  <rect x="350" y="195" width="100" height="40" rx="8" fill="#5DD6CC" opacity="0.4"/>
  <text x="400" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">TCP</text>
  <rect x="460" y="195" width="190" height="40" rx="8" fill="#02041A" opacity="0.06"/>
  <text x="555" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Andmed</text>
  
  <!-- Layer 3 -->
  <rect x="20" y="280" width="280" height="90" rx="16" fill="#A25AD9"/>
  <text x="160" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kiht 3 - Võrk</text>
  <text x="160" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">(Network)</text>
  <text x="160" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">IP päis + TCP + Andmed = Pakett</text>
  <path d="M 310 325 L 340 325" stroke="#02041A" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="340,325 332,321 332,329" fill="#02041A" opacity="0.4"/>
  <rect x="350" y="305" width="70" height="40" rx="8" fill="#A25AD9" opacity="0.4"/>
  <text x="385" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">IP</text>
  <rect x="430" y="305" width="70" height="40" rx="8" fill="#5DD6CC" opacity="0.4"/>
  <text x="465" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">TCP</text>
  <rect x="510" y="305" width="140" height="40" rx="8" fill="#02041A" opacity="0.06"/>
  <text x="580" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Andmed</text>
  
  <!-- Layer 2 -->
  <rect x="20" y="390" width="280" height="90" rx="16" fill="#FF9500"/>
  <text x="160" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kiht 2 - Andmeside</text>
  <text x="160" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">(Data Link)</text>
  <text x="160" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">ETH+IP+TCP+Andmed+FCS</text>
  <path d="M 310 435 L 340 435" stroke="#02041A" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="340,435 332,431 332,439" fill="#02041A" opacity="0.4"/>
  <rect x="350" y="415" width="55" height="40" rx="8" fill="#FF9500" opacity="0.4"/>
  <text x="377.5" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">ETH</text>
  <rect x="410" y="415" width="45" height="40" rx="8" fill="#A25AD9" opacity="0.4"/>
  <text x="432.5" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">IP</text>
  <rect x="460" y="415" width="50" height="40" rx="8" fill="#5DD6CC" opacity="0.4"/>
  <text x="485" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">TCP</text>
  <rect x="515" y="415" width="80" height="40" rx="8" fill="#02041A" opacity="0.06"/>
  <text x="555" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Andmed</text>
  <rect x="600" y="415" width="50" height="40" rx="8" fill="#FF9500" opacity="0.4"/>
  <text x="625" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">FCS</text>

  <!-- Layer 1 -->
  <rect x="20" y="500" width="280" height="90" rx="16" fill="#FFCC00"/>
  <text x="160" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#02041A" opacity="0.88" text-anchor="middle">Kiht 1 - Füüsiline</text>
  <text x="160" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">(Physical)</text>
  <text x="160" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">10110010... = Bitid</text>
  <path d="M 310 545 L 340 545" stroke="#02041A" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="340,545 332,541 332,549" fill="#02041A" opacity="0.4"/>
  <rect x="350" y="525" width="300" height="40" rx="8" fill="#FFCC00" opacity="0.4"/>
  <text x="500" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.88" text-anchor="middle">10110010110110010110...</text>

  <!-- Right Side Process -->
  <text x="680" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#02041A" opacity="0.88">Protsess:</text>
  <rect x="680" y="90" width="280" height="120" rx="12" fill="#02041A" opacity="0.06"/>
  <text x="820" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Andmed</text>
  <text x="820" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">↓ +TCP</text>
  <text x="820" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">↓ +IP</text>
  <text x="820" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">↓ +ETH+FCS</text>
  <text x="820" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">↓ Bitid</text>

  <!-- Info Text -->
  <text x="680" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#02041A" opacity="0.88">Iga kiht lisab oma päise:</text>
  <text x="680" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6">• Rakenduskiht: loob andmed</text>
  <text x="680" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6">• Transpordikiht: lisab TCP päise</text>
  <text x="700" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.4">(port, järjekorranumber)</text>
  <text x="680" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6">• Võrgukiht: lisab IP päise</text>
  <text x="700" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.4">(lähte- ja siht-IP)</text>
  <text x="680" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6">• Andmesidekiht: lisab Ethernet</text>
  <text x="700" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.4">päise ja FCS</text>
  <text x="680" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6">• Füüsiline kiht: muudab bittideks</text>

  <!-- Bottom Note -->
  <rect x="680" y="525" width="280" height="60" rx="12" fill="#02041A" opacity="0.06"/>
  <text x="820" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">Dekapseldamine toimub</text>
  <text x="820" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#02041A" opacity="0.6" text-anchor="middle">vastupidises järjekorras</text>
</svg>
